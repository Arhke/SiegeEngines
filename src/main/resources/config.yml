# ======================================
# |            Projectiles             |
# ======================================

# You can define as many projectiles as you want for use in Siege Engines

# === Notes on projectile config options ===
# ProjectileType: ENTITY, EXPLOSIVE, FIRWORK or POTION
# ExplodePower: Only used in "EXPLOSIVE" projectile types, defines explosion power
# ExplodePowerVariation: Only used in "EXPLOSIVE" projectile types, the most each shot's power can randomly vary
#   either way, as a fraction of ExplodePower (0.15 = +/-15%, 0 = no variation). Defaults to 0.15 if left out
# Inaccuracy: A factor of ramdomness (spread) applied to the aimed vector
# ProjectileCount: How many individual projectile entities will be fired
# VelocityFactor: How fast the projectile(s) will move through the air
# AmmoItem: The item that must be held to fire the projectile
# https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
# AmmoName: Optional, the custom name the held item must have, with & color codes (e.g. "&6Breach Shot")
#   Colors count, so a name with a color can't be copied by renaming an item in an anvil
# AmmoLore: Optional, the lore lines the held item must have, all of them in this order, with & color codes
#   Players can't add lore themselves, so this is the safest check
#   If several projectiles match the held item, the one that checks the most (name and lore) is fired
# FireSound: What sound the Siege Engine makes when the projectile is fired
# https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
# ArrowDamageFactor: A factor of arrow damage, only applies to ENTITY projectiles of type ARROW
# Strength: How many reinforcement breaks the explosion does to the block it hits, fading with distance
#   (see Reinforcement.DamageFalloffRadius). Decimals are allowed. EXPLOSIVE projectiles that hit a block at an angle do less, down to
#   almost none for a glancing hit. Other explosions use Reinforcement.ExplosionStrength. Only used in "EXPLOSIVE"
#   projectiles and ENTITY projectiles of type TNT. Defaults to 2 for EXPLOSIVE and 1 for TNT if left out


Projectiles:
  StoneShot:
    ProjectileType: EXPLOSIVE
    ExplodePower: 3.25
    Strength: 2
    ExplodePowerVariation: 0.15
    Inaccuracy: 0.125
    ProjectileCount: 1
    VelocityFactor: 1.0
    AmmoItem: COBBLESTONE
    FireSound: ENTITY_GENERIC_EXPLODE
  BreachShot:
    ProjectileType: EXPLOSIVE
    ExplodePower: 5.25
    Strength: 4
    ExplodePowerVariation: 0.15
    Inaccuracy: 0.375
    ProjectileCount: 1
    VelocityFactor: 1.0
    AmmoItem: IRON_BLOCK
    FireSound: ENTITY_GENERIC_EXPLODE
  RepeatingShot:
    ProjectileType: EXPLOSIVE
    ExplodePower: 1.75
    Strength: 1
    ExplodePowerVariation: 0.15
    Inaccuracy: 0.525
    ProjectileCount: 6
    VelocityFactor: 1.0
    AmmoItem: TNT
    FireSound: ENTITY_GENERIC_EXPLODE
  ScatterShot:
    ProjectileType: ENTITY
    Inaccuracy: 0.365
    ProjectileCount: 24
    VelocityFactor: 1.0
    EntityType: ARROW
    ArrowDamageFactor: 1.0
    AmmoItem: GRAVEL
    FireSound: ITEM_CROSSBOW_SHOOT
  BallistaBoltShot:
    ProjectileType: ENTITY
    Inaccuracy: 0.0125
    ProjectileCount: 1
    VelocityFactor: 0.5
    EntityType: ARROW
    ArrowDamageFactor: 1.0
    AmmoItem: ARROW
    FireSound: ITEM_CROSSBOW_SHOOT
  DragonsBreath:
    ProjectileType: ENTITY
    Inaccuracy: 0.65
    ProjectileCount: 3
    VelocityFactor: 1.125
    EntityType: DRAGON_FIREBALL
    AmmoItem: DRAGON_BREATH
    FireSound: ENTITY_GENERIC_EXPLODE
  FireShot:
    ProjectileType: ENTITY
    Inaccuracy: 0.475
    ProjectileCount: 8
    VelocityFactor: 1.0
    EntityType: SMALL_FIREBALL
    AmmoItem: MAGMA_BLOCK
    FireSound: ENTITY_GENERIC_EXPLODE
  FireworkShot:
    ProjectileType: FIREWORK
    Inaccuracy: 0.125
    ProjectileCount: 1
    VelocityFactor: 0.5
    Delay: 5
  SplashPotionProjectile:
    ProjectileType: POTION
    Inaccuracy: 0.0125
    ProjectileCount: 1
    VelocityFactor: 0.5
    AmmoItem: SPLASH_POTION
    FireSound: ITEM_CROSSBOW_SHOOT
  # Trebuchet: a spread of loose stones, weaker than StoneShot but covers an area
  RubbleShot:
    ProjectileType: EXPLOSIVE
    ExplodePower: 1.25
    Strength: 1
    ExplodePowerVariation: 0.25
    Inaccuracy: 0.6
    ProjectileCount: 5
    VelocityFactor: 1.0
    AmmoItem: GRAVEL
    FireSound: ENTITY_GENERIC_EXPLODE
  # Trebuchet: a clay pot of burning naphtha that bursts into flames
  GreekFire:
    ProjectileType: ENTITY
    Inaccuracy: 0.2
    ProjectileCount: 1
    VelocityFactor: 1.0
    EntityType: FIREBALL
    AmmoItem: MAGMA_CREAM
    FireSound: ITEM_FIRECHARGE_USE
  # Ballista: a single burning bolt that sets its target alight
  FireBolt:
    ProjectileType: ENTITY
    Inaccuracy: 0.0125
    ProjectileCount: 1
    VelocityFactor: 0.75
    EntityType: SMALL_FIREBALL
    AmmoItem: BLAZE_POWDER
    FireSound: ITEM_CROSSBOW_SHOOT
  # Ballista: a marked bolt that makes whatever it hits glow, for spotting targets
  SignalBolt:
    ProjectileType: ENTITY
    Inaccuracy: 0.0125
    ProjectileCount: 1
    VelocityFactor: 0.5
    EntityType: SPECTRAL_ARROW
    ArrowDamageFactor: 0.5
    AmmoItem: SPECTRAL_ARROW
    FireSound: ITEM_CROSSBOW_SHOOT
  # Cannons: a bag of iron balls that sprays out like a shotgun, deadly up close
  Grapeshot:
    ProjectileType: ENTITY
    Inaccuracy: 0.45
    ProjectileCount: 16
    VelocityFactor: 0.6
    EntityType: ARROW
    ArrowDamageFactor: 0.4
    AmmoItem: IRON_NUGGET
    FireSound: ENTITY_GENERIC_EXPLODE
  # Cannons: two balls chained together, few but heavy hitting
  ChainShot:
    ProjectileType: ENTITY
    Inaccuracy: 0.15
    ProjectileCount: 2
    VelocityFactor: 0.8
    EntityType: ARROW
    ArrowDamageFactor: 2.0
    AmmoItem: IRON_CHAIN
    FireSound: ENTITY_GENERIC_EXPLODE
  # Breach Cannon: a hollow shell with a lit fuse, it bounces and rolls before it explodes like TNT
  Bombshell:
    ProjectileType: ENTITY
    Inaccuracy: 0.1
    ProjectileCount: 1
    VelocityFactor: 0.5
    EntityType: TNT
    Strength: 2
    AmmoItem: FIRE_CHARGE
    FireSound: ENTITY_GENERIC_EXPLODE

# ======================================
# |            Siege Engines           |
# ======================================

# At this time you cannot add new Siege Engines via the config
# You can edit the existing Siege Engines with the various options below

# Siege Engines are fired with the item in the player's main hand at the moment the Siege Engine shoots.
# If that item is the AmmoItem of one of the Siege Engine's Projectiles, that projectile is fired and one
# of the item is consumed (except in creative mode). Otherwise the DefaultProjectile is fired for free.

# Health: How many hearts of health the Siege Engine has before it is destroyed
# Shot Amount: How many projectiles the Siege Engine will fire
# Velocity: The base velocity of fired projectiles, multiplied by the projectile's VelocityFactor
# MinAimAngle / MaxAimAngle: The lowest and highest angle in degrees above the horizon the Siege Engine can aim, negative is below
# Cooldown: Seconds after a shot before the Siege Engine can fire again, the reload animation plays during it
# Projectiles: The projectiles that can be fired by holding their AmmoItem
# DefaultProjectile: The projectile fired when not holding the AmmoItem of any of the above Projectiles
# ItemName: The default item name for the Siege Engine item
# Lore: The default lore for the Siege Engine item
# CanMount (EXPERIMENTAL): Whether the Siege Engine can be placed on a mountable mob

SiegeEngines:
  Trebuchet:
    # Lobs only, the sling releases between 30 and 70 degrees and it cannot fire flat or downwards
    MinAimAngle: 30
    MaxAimAngle: 70
    Health: 8
    ShotAmount: 1
    Velocity: 2.25
    Cooldown: 5
    Projectiles:
      - StoneShot
      - BreachShot
      - FireShot
      - RepeatingShot
      - RubbleShot
      - GreekFire
      - SplashPotionProjectile
    DefaultProjectile: StoneShot
    ItemName: "&e&lTrebuchet"
    Lore:
      - "&ePlace as a block to spawn a Trebuchet"
      - "&7Right click to take or release control"
      - "&7Left click to fire while in control"
  Ballista:
    # Tilts on its stand, 45 degrees for its longest shot and down over walls
    MinAimAngle: -15
    MaxAimAngle: 45
    Health: 5
    ShotAmount: 1
    Velocity: 4.0
    Cooldown: 2
    Projectiles:
      - BallistaBoltShot
      - ScatterShot
      - DragonsBreath
      - FireworkShot
      - SplashPotionProjectile
      - FireBolt
      - SignalBolt
    DefaultProjectile: BallistaBoltShot
    ItemName: "&e&lBallista"
    Lore:
      - "&ePlace as a block to spawn a Ballista"
      - "&7Right click to take or release control"
      - "&7Left click to fire while in control"
    CanMount: false
  SwivelCannon:
    # Swung by hand on its yoke, depressing steeply to fire down at attackers below
    MinAimAngle: -30
    MaxAimAngle: 40
    Health: 15
    ShotAmount: 1
    Velocity: 4.875
    Cooldown: 2
    Projectiles:
      - StoneShot
      - RepeatingShot
      - ScatterShot
      - FireShot
      - FireworkShot
      - Grapeshot
      - ChainShot
    DefaultProjectile: StoneShot
    ItemName: "&e&lSwivel Cannon"
    Lore:
      - "&ePlace as a block to spawn a Swivel Cannon"
      - "&7Right click to take or release control"
      - "&7Left click to fire while in control"
  BreachCannon:
    # A heavy gun on a wedge carriage, fired near flat to batter walls
    MinAimAngle: -5
    MaxAimAngle: 15
    Health: 25
    ShotAmount: 1
    Velocity: 4.25
    Cooldown: 4
    Projectiles:
      - StoneShot
      - RepeatingShot
      - BreachShot
      - FireShot
      - ScatterShot
      - DragonsBreath
      - FireworkShot
      - Grapeshot
      - ChainShot
      - Bombshell
    DefaultProjectile: StoneShot
    ItemName: "&e&lBreach Cannon"
    Lore:
      - "&ePlace as a block to spawn a Breach Cannon"
      - "&7Right click to take or release control"
      - "&7Left click to fire while in control"
