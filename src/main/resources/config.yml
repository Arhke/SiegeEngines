# DO NOT CHANGE
config-version: 2

# =====================================
# |         GENERAL SETTINGS          |
# =====================================

# Enable/Disable Debug logging.
Debug: false

# Allows the disabling of Arrow Damage towards SiegeEngines.
DisableArrowDamage: true

# Determines how close together two or more SiegeEngines can be placed together.
PlacementDensity: 2.5

# The maxmimum distance the player can be away from the SiegeEngine before total control is terminated
ControlDistance: 10

# The maximum distance the player can be away from the SiegeEngine before rotation control is terminated
RotateDistance: 10

# The maximum siege engines a player can control at the same time
MaxSiegeEnginesControlled: 1

# Whether the crafting recipes for siege engines are enabled
CraftingRecipes: true

# Worlds where all Siege Engine actions will be disabled including placing and firing
DisabledWorlds:
  - world_nether
  - world_the_end

# Explosions from EXPLOSIVE projectiles use these block resistances instead of the vanilla ones
# Other explosions, including the Bombshell, TNT and creepers, are not affected
# For reference: stone is 6, obsidian and reinforced deepslate are 1200
SiegeExplosions:
  # Whether water and lava are ignored, so they don't protect what is behind or under them
  IgnoreFluids: true
  # Blocks stronger than this count as this. Unbreakable blocks such as bedrock are never broken
  MaxBlastResistance: 12
  # Reinforced deepslate counts as this instead of MaxBlastResistance
  ReinforcedDeepslateBlastResistance: 12

# Every block takes a number of breaks from explosions before it breaks, without having to be reinforced
# Each explosion does its strength in breaks to the block it hits, fading to nothing at DamageFalloffRadius
# Mining by hand is not affected. Damage isn't saved, and is forgotten when its chunk unloads
# Players can see how many breaks damaged blocks have left with /rv
Reinforcement:
  Enabled: true
  # How many breaks every block can take, unless it is in NotReinforceable. Decimals are allowed
  DefaultBreaks: 500
  # Damage fades linearly from full at the explosion to nothing this many blocks away. 0 turns falloff off
  DamageFalloffRadius: 3
  # Damage going in a thin direction is multiplied by this, so thin and spaced walls don't hold up like thick ones.
  # The explosion pushes each block straight into the surface a siege engine projectile hit, or directly away from any
  # other explosion (TNT, creepers, ...). Its damage is split between the x, y and z parts of that push, in proportion
  # to how much the push goes each way. Each part is checked on its own, going block by block in that direction through
  # blocks the explosion also hit: it's thin if it comes out into air or a partial block (slab, stairs...), and not thin
  # if it comes out into a full solid block the explosion didn't hit (including protected blocks) or one that isn't
  # reinforceable (glass, sand, ...), even if the explosion hit it.
  # Set it very high to make thin blocks break instantly. Decimals are allowed
  ThinBlockDamageMultiplier: 5
  # Strength of explosions that aren't from siege engines (TNT, creepers, ...). Siege engine projectiles have their own Strength
  ExplosionStrength: 1
  # Minutes after a block was last damaged before its damage is forgotten
  ForgetDamageAfter: 60
  # Whether blocks that fall (sand, gravel, concrete powder, anvils, ...) take breaks. If false they break the vanilla way
  ReinforceFallingBlocks: false
  # Blocks whose name contains any of these break the vanilla way, unless their name contains BLOCK
  # https://jd.papermc.io/paper/org/bukkit/Material.html
  NotReinforceable:
    - BEDROCK
    - END_PORTAL_FRAME
    - TALL_GRASS
    - GRASS
    - BAMBOO
    - FLOWER
    - MUSHROOM
    - DEAD_BUSH
    - SUGAR_CANE
    - VINE
    - NETHER_WART
    - STEM
    - SAPLING
    - BARRIER
    - BEETROOT
    - BANNER
    - CARPET
    - CORAL
    - CHORUS_FLOWER
    - COMMAND_BLOCK
    - MOVING_PISTON
    - PISTON_HEAD
    - TNT
    - FIRE
    - SNOW
    - ICE
    - CACTUS
    - PORTAL
    - CAKE
    - ROSE
    - SUNFLOWER
    - ORCHID
    - CAMPFIRE
    - DANDELION
